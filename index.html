<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChanSlide</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #1f2630;
        --text: #e6edf3;
        --muted: #9ba7b4;
        --accent: #4cc2ff;
        --good: #35d07f;
        --warn: #ffcd52;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top right, #132038, var(--bg) 55%);
      }

      .app {
        width: min(1100px, 100%);
        margin: 0 auto;
        padding: 18px;
        display: grid;
        gap: 14px;
      }

      .panel {
        background: linear-gradient(165deg, rgb(31 38 48 / 96%), rgb(22 27 34 / 96%));
        border: 1px solid rgb(255 255 255 / 10%);
        border-radius: 14px;
        box-shadow: 0 14px 40px rgb(0 0 0 / 30%);
      }

      .controls {
        padding: 12px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 10px;
        align-items: end;
      }

      .field label {
        display: block;
        font-size: 0.82rem;
        color: var(--muted);
        margin-bottom: 6px;
      }

      .field select,
      .field input,
      .btn {
        width: 100%;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 10px;
        background: #0f141b;
        color: var(--text);
        padding: 10px;
        font-size: 0.95rem;
      }

      .btn {
        cursor: pointer;
        background: linear-gradient(180deg, #1e2935, #18212c);
      }

      .btn.primary {
        border-color: rgb(76 194 255 / 45%);
        color: #d8f2ff;
      }

      .slideshow {
        padding: 12px;
      }

      .viewer {
        position: relative;
        width: 100%;
        background: #05070b;
        border-radius: 12px;
        overflow: hidden;
        min-height: 68vh;
        border: 1px solid rgb(255 255 255 / 12%);
        touch-action: pan-y;
        user-select: none;
      }

      .viewer img,
      .viewer video {
        width: 100%;
        height: 68vh;
        object-fit: contain;
        display: none;
        background: #020304;
      }

      .viewer .active {
        display: block;
      }

      .overlay {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 10px;
        background: linear-gradient(180deg, rgb(0 0 0 / 0%), rgb(0 0 0 / 72%));
        font-size: 0.9rem;
      }

      .meta-title {
        margin: 0 0 4px;
        font-weight: 600;
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        color: var(--muted);
      }

      .topbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: space-between;
        align-items: center;
        padding: 8px 10px;
        font-size: 0.9rem;
      }

      .status {
        color: var(--accent);
      }

      .hint {
        color: var(--muted);
      }

      .pill {
        background: rgb(53 208 127 / 16%);
        color: var(--good);
        border: 1px solid rgb(53 208 127 / 40%);
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 0.8rem;
      }

      .warn {
        color: var(--warn);
      }

      @media (max-width: 680px) {
        .viewer,
        .viewer img,
        .viewer video {
          min-height: 56vh;
          height: 56vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <section class="panel controls" aria-label="Slideshow controls">
        <div class="field">
          <label for="board-select">Board</label>
          <select id="board-select">
            <option value="wg">/wg/ - Wallpapers</option>
            <option value="w">/w/ - Anime/Wallpapers</option>
            <option value="hr">/hr/ - High Resolution</option>
            <option value="gif">/gif/ - GIF</option>
            <option value="g">/g/ - Technology</option>
            <option value="tv">/tv/ - Television & Film</option>
            <option value="v">/v/ - Video Games</option>
          </select>
        </div>

        <div class="field">
          <label for="slide-seconds">Timer (seconds)</label>
          <input id="slide-seconds" type="number" min="2" max="60" value="8" />
        </div>

        <div class="field">
          <label for="max-items">Max media items</label>
          <input id="max-items" type="number" min="10" max="200" value="60" />
        </div>

        <div class="field">
          <label for="include-webm">Video support</label>
          <select id="include-webm">
            <option value="yes">Images + WEBM</option>
            <option value="no">Images only</option>
          </select>
        </div>

        <button class="btn primary" id="load-btn" type="button">Load Board</button>
        <button class="btn" id="toggle-play" type="button">Pause</button>
        <button class="btn" id="next-btn" type="button">Next ➜</button>
      </section>

      <section class="panel slideshow">
        <div class="topbar">
          <div>
            <span class="status" id="status">Loading...</span>
            <span class="pill" id="counter">0 / 0</span>
          </div>
          <div class="hint">Swipe left/right (or arrow keys) to navigate.</div>
        </div>

        <div class="viewer" id="viewer">
          <img id="slide-image" alt="4chan media slide" />
          <video id="slide-video" controls playsinline loop muted preload="metadata"></video>
          <div class="overlay">
            <p class="meta-title" id="meta-title">Waiting for content…</p>
            <div class="meta-row">
              <span id="meta-board">Board: --</span>
              <span id="meta-type">Type: --</span>
              <span id="meta-post">Post: --</span>
              <span id="meta-timer">Timer: --</span>
            </div>
          </div>
        </div>
      </section>

      <p class="hint warn">
        Note: 4chan endpoints may block direct browser requests in some environments due to CORS/rate limits. This app
        automatically retries via a read-only public proxy when needed.
      </p>
    </div>

    <script>
      const state = {
        board: 'wg',
        slideSeconds: 8,
        maxItems: 60,
        includeWebm: true,
        items: [],
        index: 0,
        timerId: null,
        playing: true,
        touchStartX: null
      };

      const boardSelect = document.getElementById('board-select');
      const slideSecondsInput = document.getElementById('slide-seconds');
      const maxItemsInput = document.getElementById('max-items');
      const includeWebmSelect = document.getElementById('include-webm');
      const loadBtn = document.getElementById('load-btn');
      const togglePlayBtn = document.getElementById('toggle-play');
      const nextBtn = document.getElementById('next-btn');

      const statusEl = document.getElementById('status');
      const counterEl = document.getElementById('counter');
      const imageEl = document.getElementById('slide-image');
      const videoEl = document.getElementById('slide-video');
      const viewerEl = document.getElementById('viewer');
      const metaTitleEl = document.getElementById('meta-title');
      const metaBoardEl = document.getElementById('meta-board');
      const metaTypeEl = document.getElementById('meta-type');
      const metaPostEl = document.getElementById('meta-post');
      const metaTimerEl = document.getElementById('meta-timer');

      function setStatus(text, isError = false) {
        statusEl.textContent = text;
        statusEl.style.color = isError ? '#ff8a8a' : 'var(--accent)';
      }

      function escapeHtml(unsafe) {
        return String(unsafe)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;');
      }

      async function fetchCatalog(board) {
        const directUrl = `https://a.4cdn.org/${board}/catalog.json`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(directUrl)}`;

        try {
          const res = await fetch(directUrl);
          if (!res.ok) throw new Error('Direct request failed');
          return await res.json();
        } catch {
          const res = await fetch(proxyUrl);
          if (!res.ok) throw new Error('Proxy request failed');
          return await res.json();
        }
      }

      function collectMedia(catalog) {
        const items = [];

        for (const page of catalog) {
          for (const thread of page.threads || []) {
            if (!thread.tim || !thread.ext) continue;

            const ext = thread.ext.toLowerCase();
            const isImage = ['.jpg', '.jpeg', '.png', '.gif'].includes(ext);
            const isVideo = ext === '.webm';

            if (!isImage && !(state.includeWebm && isVideo)) continue;

            items.push({
              board: state.board,
              postNo: thread.no,
              ext,
              type: isVideo ? 'WEBM' : 'Image',
              mediaUrl: `https://i.4cdn.org/${state.board}/${thread.tim}${ext}`,
              threadUrl: `https://boards.4chan.org/${state.board}/thread/${thread.no}`,
              title: thread.sub || thread.semantic_url || `/${state.board}/ thread ${thread.no}`,
              comment: thread.com || ''
            });
          }
        }

        return items.slice(0, state.maxItems);
      }

      function updateCounter() {
        counterEl.textContent = `${state.items.length ? state.index + 1 : 0} / ${state.items.length}`;
      }

      function clearMedia() {
        imageEl.classList.remove('active');
        videoEl.classList.remove('active');
        videoEl.pause();
      }

      function renderSlide() {
        if (!state.items.length) {
          clearMedia();
          metaTitleEl.textContent = 'No media found.';
          metaBoardEl.textContent = `Board: /${state.board}/`;
          metaTypeEl.textContent = 'Type: --';
          metaPostEl.textContent = 'Post: --';
          updateCounter();
          return;
        }

        const item = state.items[state.index];
        clearMedia();

        if (item.type === 'WEBM') {
          videoEl.src = item.mediaUrl;
          videoEl.classList.add('active');
          videoEl.play().catch(() => {});
        } else {
          imageEl.src = item.mediaUrl;
          imageEl.classList.add('active');
        }

        metaTitleEl.innerHTML = `${escapeHtml(item.title)} · <a href="${item.threadUrl}" target="_blank" rel="noopener" style="color:#8dd8ff;">Open thread</a>`;
        metaBoardEl.textContent = `Board: /${item.board}/`;
        metaTypeEl.textContent = `Type: ${item.type}`;
        metaPostEl.textContent = `Post: #${item.postNo}`;
        metaTimerEl.textContent = `Timer: ${state.slideSeconds}s`;
        updateCounter();
      }

      function nextSlide(direction = 1) {
        if (!state.items.length) return;
        state.index = (state.index + direction + state.items.length) % state.items.length;
        renderSlide();
      }

      function stopTimer() {
        if (state.timerId) {
          clearInterval(state.timerId);
          state.timerId = null;
        }
      }

      function startTimer() {
        stopTimer();
        if (!state.playing) return;
        state.timerId = setInterval(() => nextSlide(1), state.slideSeconds * 1000);
      }

      function updatePlayButton() {
        togglePlayBtn.textContent = state.playing ? 'Pause' : 'Play';
      }

      async function loadBoard() {
        state.board = boardSelect.value;
        state.slideSeconds = Math.max(2, Math.min(60, Number(slideSecondsInput.value) || 8));
        state.maxItems = Math.max(10, Math.min(200, Number(maxItemsInput.value) || 60));
        state.includeWebm = includeWebmSelect.value === 'yes';
        state.index = 0;

        setStatus(`Loading /${state.board}/ catalog…`);

        try {
          const catalog = await fetchCatalog(state.board);
          state.items = collectMedia(catalog);

          if (!state.items.length) {
            setStatus(`Loaded /${state.board}/, but found no matching media.`, true);
          } else {
            setStatus(`Loaded ${state.items.length} media items from /${state.board}/.`);
          }

          renderSlide();
          startTimer();
        } catch (err) {
          state.items = [];
          renderSlide();
          stopTimer();
          setStatus(`Failed to load /${state.board}/. Try again soon. (${err.message})`, true);
        }
      }

      loadBtn.addEventListener('click', loadBoard);
      nextBtn.addEventListener('click', () => nextSlide(1));

      togglePlayBtn.addEventListener('click', () => {
        state.playing = !state.playing;
        updatePlayButton();
        startTimer();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowRight') nextSlide(1);
        if (event.key === 'ArrowLeft') nextSlide(-1);
      });

      viewerEl.addEventListener('touchstart', (event) => {
        state.touchStartX = event.changedTouches[0]?.screenX ?? null;
      });

      viewerEl.addEventListener('touchend', (event) => {
        const endX = event.changedTouches[0]?.screenX;
        if (state.touchStartX === null || endX === undefined) return;

        const delta = endX - state.touchStartX;
        if (Math.abs(delta) < 40) return;
        if (delta < 0) nextSlide(1);
        if (delta > 0) nextSlide(-1);
      });

      [slideSecondsInput, maxItemsInput, includeWebmSelect, boardSelect].forEach((node) => {
        node.addEventListener('change', () => {
          state.slideSeconds = Math.max(2, Math.min(60, Number(slideSecondsInput.value) || 8));
          metaTimerEl.textContent = `Timer: ${state.slideSeconds}s`;
          if (state.playing) startTimer();
        });
      });

      updatePlayButton();
      loadBoard();
    </script>
  </body>
</html>
